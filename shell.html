<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Food Truck Fantasy</title><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(140deg,#ffe1f1,#fff5cf);font-family:system-ui,sans-serif;color:#603557;text-align:center}main{max-width:1160px;margin:auto;padding:20px}h1{margin:8px 0}p{line-height:1.5}.frame{background:#fff;border:5px solid #ec91bc;border-radius:18px;overflow:hidden;box-shadow:0 10px 30px #9a588044}canvas{width:100%;height:auto;display:block;aspect-ratio:1100/650;outline:0}#status{padding:10px}button{padding:10px 18px;border:0;border-radius:12px;background:#a84e90;color:white;cursor:pointer;margin:10px}footer{font-size:14px;margin:18px}
</style></head><body><main><h1>🍓 Food Truck Fantasy</h1><p>Four friends, magical ingredients, and a delicious dream!</p><div class="frame"><canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas></div><div id="status">Loading game…</div><button onclick="document.getElementById('canvas').focus()">Focus game controls</button><p><strong>Controls:</strong> A/D or ←/→ to move · Space to jump · Tab to switch girls · Mouse to select and sell</p><footer>Prototype edition · More character art coming soon</footer></main>
<script>var Module={canvas:document.getElementById('canvas'),setStatus:function(s){document.getElementById('status').textContent=s||'Ready to play!'},monitorRunDependencies:function(left){Module.setStatus(left?'Loading game resources…':'Starting game…')}};window.onerror=function(e){Module.setStatus('Game failed to load: '+e)};</script>

</body></html>
